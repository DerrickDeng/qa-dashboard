[project]
name = "qa-dashboard-api"
version = "0.1.0"
description = "QA dashboard API: test execution, defects, and AI effectiveness"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The SQLAlchemy models are called TestRun and TestResult; only collect functions.
python_classes = ["*Tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["qa_dashboard"]
mypy_path = "src"
strict = true
